<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f5">
  <meta name="description" content="Page not found. Get back on track with NextStep student career readiness.">
  <title>404 — Page Not Found | NextStep</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./product.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f8f8f5;
      padding: 24px;
      color: #1c261e;
      overflow-x: hidden;
      font-family: 'DM Sans', sans-serif;
    }

    .error-card {
      background: #ffffff;
      border: 1px solid #e2e7df;
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 40px rgba(28, 38, 30, 0.06);
    }

    .error-code {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 20px;
      background: #edf5ec;
      color: #205231;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 20px;
      border: 1px solid #cce0ca;
    }

    .error-title {
      font-family: 'Manrope', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.6px;
      margin: 0 0 12px;
      color: #1c261e;
    }

    .error-desc {
      font-size: 14px;
      color: #556257;
      line-height: 1.6;
      margin: 0 0 28px;
    }

    .error-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .error-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 22px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .error-btn-primary {
      background: #1c261e;
      color: #ffffff;
    }

    .error-btn-primary:hover {
      background: #2a3a2d;
      transform: translateY(-1px);
    }

    .error-btn-secondary {
      background: #ffffff;
      border: 1px solid #dce2d9;
      color: #344037;
    }

    .error-btn-secondary:hover {
      background: #f6f8f5;
    }

    .error-footer {
      margin-top: 32px;
      font-size: 12px;
      color: #7b867d;
    }

    .error-footer a {
      color: #2a633d;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="error-card" role="main">
    <div class="error-code">
      <span>✳</span> 404 · STEP NOT FOUND
    </div>
    <h1 class="error-title">We couldn't find that page.</h1>
    <p class="error-desc">
      The link you followed might be incorrect or the page may have been moved. Let's get you back on track toward your career preparation.
    </p>
    <div class="error-actions">
      <a href="./index.html" class="error-btn error-btn-primary">Return to Dashboard ↗</a>
      <a href="./profile.html" class="error-btn error-btn-secondary">My Profile</a>
    </div>
    <div class="error-footer">
      Need help? Reach us at <a href="mailto:support@nextstep.edu">support@nextstep.edu</a>
    </div>
  </main>
</body>

</html>
