services:
  - type: web
    name: nextstep-ai-career
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerCommand: python /app/run_all.py
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: AI_BASE_URL
        value: http://127.0.0.1:8000/api/ai
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: z-ai/glm-5.3
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: nextstep
